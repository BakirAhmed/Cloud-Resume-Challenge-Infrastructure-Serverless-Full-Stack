name: Deploy Cloud Resume Challenge

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve

      - name: Get S3 bucket name
        id: tf-output
        run: echo "bucket=$(terraform output -raw s3_bucket_name)" >> "$GITHUB_OUTPUT"

    outputs:
      bucket: ${{ steps.tf-output.outputs.bucket }}

  deploy-frontend:
    name: Sync Frontend to S3
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - name: Sync to S3
        run: aws s3 sync frontend/ s3://${{ needs.terraform.outputs.bucket }} --delete
